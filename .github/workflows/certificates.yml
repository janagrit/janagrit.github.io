# Rebuilds data/certificates.json when a new LinkedIn Certifications.csv is pushed.
name: Certificates from LinkedIn

on:
  push:
    branches: [master]
    paths:
      - data/linkedin/Certifications.csv
      - scripts/linkedin-certs.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/linkedin-certs.mjs
      - name: Commit the JSON if it changed
        run: |
          if [ -z "$(git status --porcelain -- data/certificates.json)" ]; then
            echo "certificates.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/certificates.json
          git commit -m "Update certificates from LinkedIn export"
          git push
